<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Ride</title>
<style>
html,body{margin:0;height:100%;background:#000}
video,canvas{width:100%;height:100%;display:block;object-fit:contain}
</style></head><body>
<video src="ride-loop-28s.mp4" aria-label="Sunset cycling loop" autoplay muted playsinline loop></video>
<script>
const video = document.querySelector('video');
function useShader() { location.replace('live.html'); }
video.addEventListener('error', useShader);
if (video.error) useShader();
video.addEventListener('click', () => { if (video.paused) video.play(); });
</script></body></html>
